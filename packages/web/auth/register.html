<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="注册 - Artificial Chat" />
  <title>注册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .register-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }
    
    .register-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 30px;
      text-align: center;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #666;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }
    
    .register-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    
    .register-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      color: #ff4d4f;
      font-size: 14px;
      margin-top: 8px;
    }
    
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-overlay.show {
      display: flex;
    }
    
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 30px;
      max-width: 400px;
      text-align: center;
    }
    
    .modal-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #333;
    }
    
    .modal-message {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    
    .modal-button {
      padding: 10px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .modal-button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1 class="register-title">创建账户</h1>
    
    <form id="register-form">
      <div class="form-group">
        <label for="username">用户名</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
          placeholder="请输入用户名"
          role="textbox"
          aria-label="用户名"
        />
        <div class="error-message" id="username-error"></div>
      </div>
      
      <div class="form-group">
        <label for="password">密码</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="new-password"
          required
          placeholder="请设置密码"
          role="textbox"
          aria-label="密码"
        />
        <div class="error-message" id="password-error"></div>
      </div>
      
      <div class="form-group">
        <label for="code">邀请码</label>
        <input
          type="text"
          id="code"
          name="code"
          required
          placeholder="请输入邀请码"
          role="textbox"
          aria-label="邀请码"
        />
        <div class="error-message" id="code-error"></div>
      </div>
      
      <button type="submit" class="register-btn" id="register-btn">
        继续
      </button>
    </form>
    
    <div class="login-link">
      已有账户？<a href="/auth/login.html">立即登录</a>
    </div>
  </div>

  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2 class="modal-title" id="modal-title">提示</h2>
      <p class="modal-message" id="modal-message"></p>
      <button class="modal-button" id="modal-button">确定</button>
    </div>
  </div>

  <script type="module" src="/src/pages/register.ts"></script>
</body>
</html>
