name = "artificial-chat"
main = "packages/worker/dist/index.mjs"
compatibility_date = "2026-05-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
directory = "packages/web/dist"

[[d1_databases]]
binding = "DB"
database_name = "artificial-chat-db"
database_id = ""

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

[observability]
enabled = true
