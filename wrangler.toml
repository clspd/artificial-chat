name = "artificial-chat"
main = "packages/worker/src/index.ts"
compatibility_date = "2025-04-28"

[assets]
binding = "ASSETS"
directory = "packages/web/dist"

[[d1_databases]]
binding = "DB"
database_name = "artificial-chat-db"
database_id = ""

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_classes = ["ChatSession"]

[vars]
AUTH_CODE_JWT_SECRET = ""
SESSION_JWT_SECRET = ""

[observability]
enabled = true
